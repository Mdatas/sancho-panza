# Automatic releases: when package.json "version" changes on main (or this file changes), and no release
# v<version> exists yet, this lints and tests the app (unit tests, the headless Electron smoke test, the web build and
# its Playwright test), builds Windows + Mac packages on GitHub's servers and publishes the GitHub Release v<version>
# with them. Release text: release-notes/v<version>.md. Can also be run by hand from the Actions tab (Run workflow).
# Actions are pinned to commit SHAs (comment = the tag they correspond to); only the publish job may write to the repo.
name: release
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml', 'release-notes/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
  test:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Browser + display libraries for the headless runs (Electron and Chromium share them)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          npx playwright install --with-deps chromium
      - name: Headless smoke test of the real app (Electron + xvfb)
        run: xvfb-run -a npx electron . --no-sandbox --smoke
      - name: Web build + Playwright test (desktop and phone viewports)
        run: |
          npm run build:web
          npm run test:web
      - name: No API keys in the repository
        run: "! grep -rIE 'sk-ant-[A-Za-z0-9_-]{20,}' --exclude-dir=node_modules . | grep -v smoke-test"
  windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci
      - run: bash scripts/package-win.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: windows, path: out/*.zip }
  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci
      - run: bash scripts/package-mac.sh
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: mac, path: out/*.zip }
  publish:
    needs: [check, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: assets, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.check.outputs.version }}
        run: |
          NOTES="release-notes/$TAG.md"; [ -f "$NOTES" ] || { echo "Sancho Panza · Age of Empires 2 Fan Companion $TAG" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          TITLE=$(head -1 "$NOTES" | sed 's/^#* *//')
          tail -n +2 "$NOTES" > /tmp/body.md
          gh release create "$TAG" assets/*.zip --target "$GITHUB_SHA" --title "$TITLE" --notes-file /tmp/body.md --latest
